  <style>
    .page-header {
      text-align: center;
      padding: 36px 20px 20px;
    }
    .page-header h1 span { color: var(--pink); }
    .page-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 860px;
      margin: 0 auto 40px;
    }

    .sound-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 18px 14px 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .sound-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 80%, rgba(255,45,111,0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sound-card:hover {
      border-color: var(--pink);
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(255,45,111,0.15), 0 0 0 1px rgba(255,45,111,0.2);
    }

    .sound-card:hover::after { opacity: 1; }

    .sound-card.playing {
      border-color: var(--pink);
      box-shadow: 0 0 30px rgba(255,45,111,0.3);
    }

    .sound-card img {
      width: 110px;
      height: 76px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      transition: filter 0.25s;
    }

    .sound-card:hover img { filter: brightness(1.1); }

    .sound-card .car-name {
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .play-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,45,111,0.15);
      border: 1px solid rgba(255,45,111,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--pink);
      transition: all 0.2s;
    }

    .sound-card:hover .play-icon {
      background: rgba(255,45,111,0.28);
      box-shadow: 0 0 12px rgba(255,45,111,0.4);
    }

    .sound-card.playing .play-icon {
      background: var(--pink);
      color: white;
      box-shadow: 0 0 16px rgba(255,45,111,0.6);
    }

    /* Equalizer bars when playing */
    .eq-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
    }
    .eq-bars span {
      width: 3px;
      background: var(--pink);
      border-radius: 2px;
      animation: eqBounce 0.5s ease-in-out infinite alternate;
    }
    .eq-bars span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .eq-bars span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .eq-bars span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
    .eq-bars span:nth-child(4) { height: 16px; animation-delay: 0.15s; }
    .eq-bars span:nth-child(5) { height: 6px; animation-delay: 0.05s; }
    @keyframes eqBounce {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }
    .eq-bars { display: none; }
    .sound-card.playing .eq-bars { display: flex; }
    .sound-card.playing .play-icon i { display: none; }
  </style>

  <script>
    let currentAudio = null;
    let currentCard = null;

    function playSound(card, url) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (currentCard) currentCard.classList.remove('playing');
        if (currentCard === card) { currentCard = null; currentAudio = null; return; }
      }
      const audio = new Audio(url);
      audio.play();
      card.classList.add('playing');
      currentAudio = audio;
      currentCard = card;
      audio.addEventListener('ended', () => {
        card.classList.remove('playing');
        currentAudio = null;
        currentCard = null;
      });
    }
  </script>
