<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MidNight Tuners — Learn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../style.css"/>
  <style>
    .page-header {
      text-align: center;
      padding: 36px 20px 20px;
    }
    .page-header h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
    .page-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 8px; }

    .learn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto 40px;
    }

    .learn-item {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px 14px 18px;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .learn-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,229,255,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .learn-item:hover {
      border-color: var(--cyan);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,229,255,0.15), 0 0 0 1px rgba(0,229,255,0.2);
      color: var(--text-primary);
    }

    .learn-item:hover::before { opacity: 1; }

    .learn-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(0,229,255,0.3));
      transition: transform 0.25s, filter 0.25s;
    }

    .learn-item:hover img {
      transform: scale(1.1);
      filter: drop-shadow(0 0 14px rgba(0,229,255,0.6));
    }

    .learn-item .label {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .learn-item .arrow {
      font-size: 0.65rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .learn-item:hover .arrow { color: var(--cyan); }
  </style>
</head>
