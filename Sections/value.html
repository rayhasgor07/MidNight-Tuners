<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MidNight Tuners — Value Estimator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .value-wrap {
      max-width: 600px;
      margin: 28px auto;
      padding: 0 16px;
    }

    .page-header {
      text-align: center;
      padding: 28px 0 20px;
    }

    .page-header h1 span { color: var(--gold); }

    .page-header p { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; }

    .estimator-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .estimator-card select,
    .estimator-card input {
      margin-bottom: 4px;
    }

    #calculate {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      font-size: 0.9rem;
    }

    #carImage {
      width: 55%;
      margin: 20px auto 0;
      display: none;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      box-shadow: 0 0 30px rgba(255,200,69,0.1);
    }

    .result-box {
      text-align: center;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255,200,69,0.05);
      border: 1px solid rgba(255,200,69,0.2);
      border-radius: var(--radius-md);
      display: none;
    }

    .result-box .value-amount {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    .result-box .value-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    #valueChart {
      margin-top: 24px;
      border-radius: var(--radius-sm);
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 400px) { .select-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="title">VALUE ESTIMATOR</div>
  <header>
    <div id="navigation">
      <a href="./home.html"><i class="fa-solid fa-house"></i></a>
      <a href="./feed.html"><i class="fa-solid fa-plus"></i></a>
      <a href="./learn.html"><i class="fa-solid fa-graduation-cap"></i></a>
      <a href="./value.html" class="active"><i class="fa-solid fa-sack-dollar"></i></a>
      <a href="./calc.html"><i class="fa-solid fa-calculator"></i></a>
      <a href="./sound.html"><i class="fa-solid fa-volume-high"></i></a>
      <a href="./ai.html"><i class="fa-solid fa-robot"></i></a>
    </div>
  </header>

  <div class="value-wrap">
    <div class="page-header">
      <h1>Car <span>Value</span> Estimator</h1>
      <p>Get an estimated market value for your JDM car based on model, year and mileage.</p>
    </div>

    <div class="estimator-card">
      <div class="select-row">
        <div>
          <label for="brand">Brand</label>
          <select id="brand"><option value="">-- Brand --</option></select>
        </div>
        <div>
          <label for="car">Model / Gen</label>
          <select id="car"><option value="">-- Model --</option></select>
        </div>
      </div>

      <div class="select-row" style="margin-top:4px;">
        <div>
          <label for="year">Year</label>
          <select id="year"><option value="">-- Year --</option></select>
        </div>
        <div>
          <label for="miles">Mileage (km)</label>
          <input type="number" id="miles" placeholder="e.g. 45000"/>
        </div>
      </div>

      <img id="carImage" alt="Car preview"/>

      <button id="calculate">⚡ Calculate Value</button>

      <div class="result-box" id="resultBox">
        <div class="value-label">Estimated Market Value</div>
        <div class="value-amount" id="resultAmt">—</div>
        <div class="value-label" id="resultSub"></div>
      </div>

      <canvas id="valueChart" style="max-height:300px;"></canvas>
    </div>
  </div>

  <footer>© 2026 Rayyan Hasan Goraya. All rights reserved.</footer>

  <script>
    let carData = {};

    fetch('../value.json').then(r => r.json()).then(data => {
      carData = data;
      for (const brand in carData) {
        const opt = document.createElement('option');
        opt.value = brand; opt.textContent = brand;
        document.getElementById('brand').appendChild(opt);
      }
    });

    const brandSel = document.getElementById('brand');
    const carSel   = document.getElementById('car');
    const yearSel  = document.getElementById('year');
    const ctx = document.getElementById('valueChart').getContext('2d');
    let chart = null;

    brandSel.addEventListener('change', () => {
      carSel.innerHTML = '<option value="">-- Model --</option>';
      yearSel.innerHTML = '<option value="">-- Year --</option>';
      const brand = brandSel.value;
      if (brand && carData[brand]) {
        for (const car in carData[brand]) {
          const opt = document.createElement('option');
          opt.value = car; opt.textContent = carData[brand][car].displayName;
          carSel.appendChild(opt);
        }
      }
    });

    carSel.addEventListener('change', () => {
      yearSel.innerHTML = '<option value="">-- Year --</option>';
      const brand = brandSel.value, car = carSel.value;
      if (brand && car && carData[brand][car]) {
        carData[brand][car].productionYears.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y; opt.textContent = y;
          yearSel.appendChild(opt);
        });
        const info = carData[brand][car];
        const img = document.getElementById('carImage');
        if (info.image) { img.src = info.image; img.style.display = 'block'; }
        else { img.style.display = 'none'; }
      }
    });

    document.getElementById('calculate').addEventListener('click', () => {
      const brand = brandSel.value, car = carSel.value;
      const year = parseInt(yearSel.value);
      const miles = parseInt(document.getElementById('miles').value);

      const resultBox = document.getElementById('resultBox');
      const resultAmt = document.getElementById('resultAmt');
      const resultSub = document.getElementById('resultSub');

      if (!brand || !car || !year || !miles) {
        resultBox.style.display = 'block';
        resultAmt.textContent = '⚠️ Fill all fields';
        resultAmt.style.fontSize = '1rem';
        resultAmt.style.color = 'rgba(255,80,80,0.8)';
        return;
      }

      const baseValue = carData[brand][car].value[year];
      let value = baseValue - (miles / 10000) * (baseValue * 0.02);
      value = Math.max(value, 2000);

      resultBox.style.display = 'block';
      resultAmt.style.fontSize = '2rem';
      resultAmt.style.color = 'var(--gold)';
      resultAmt.textContent = '$' + value.toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' USD';
      resultSub.textContent = `${carData[brand][car].displayName} · ${year} · ${miles.toLocaleString()} km`;

      const years = carData[brand][car].productionYears;
      const values = years.map(y => {
        let v = carData[brand][car].value[y];
        v -= (miles / 10000) * (v * 0.02);
        return Math.max(v, 2000);
      });

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years,
          datasets: [{
            label: `${carData[brand][car].displayName} — Value Over Time`,
            data: values,
            borderColor: '#ffc845',
            backgroundColor: 'rgba(255,200,69,0.08)',
            tension: 0.35,
            fill: true,
            borderWidth: 2.5,
            pointRadius: 4,
            pointBackgroundColor: '#ffc845',
            pointBorderColor: 'rgba(255,200,69,0.4)',
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: '#aaa', font: { size: 12, family: "'Exo 2'" } } },
            tooltip: { backgroundColor: '#0a1a24', titleColor: '#ffc845', bodyColor: '#eaf6ff' }
          },
          scales: {
            x: { title: { display: true, text: 'Year', color: '#666' }, ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.04)' } },
            y: { title: { display: true, text: 'Value (USD)', color: '#666' }, ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.04)' } }
          }
        }
      });
    });
  </script>
</body>
</html>
